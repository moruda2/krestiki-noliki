<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Крестики · Задачник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0b'/%3E%3Cpath d='M30 30 L70 70 M70 30 L30 70' stroke='%236ee7b7' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="top">
    <div class="brand">Крестики · <em>Задачник</em></div>
    <nav class="tiers" aria-label="Размер доски">
      <button class="tier" data-tier="3x3" aria-selected="true">3×3</button>
      <button class="tier" data-tier="4x4" aria-selected="false">4×4</button>
      <button class="tier" data-tier="5x5" aria-selected="false">5×5</button>
    </nav>
  </header>

  <main class="stage">
    <h1 class="title">Один ход — победа или поражение</h1>
    <p class="sub">Ход за крестиками. Найди единственную клетку, после которой партия выиграна.</p>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Игровое поле"></div>
      <svg class="overlay" id="overlay" aria-hidden="true"></svg>
    </div>

    <div class="status status-idle" id="status">
      <span class="dot"></span>
      <span class="txt">Ваш ход</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="nextBtn" type="button" hidden>Следующая →</button>
      <button class="btn" id="retryBtn" type="button" hidden>Ещё раз</button>
    </div>
  </main>

  <script src="puzzles.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
